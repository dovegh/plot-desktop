<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plot</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0e0f12; color: #eceef2; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { text-align: center; max-width: 380px; padding: 24px; }
  svg { width: 56px; height: 56px; margin-bottom: 18px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  p { color: #9ba2ae; margin: 0 0 22px; }
  button { height: 38px; padding: 0 18px; border-radius: 9px; border: 0; background: #3b82f6; color: #fff; font: inherit; font-weight: 500; cursor: pointer; }
  button:hover { background: #2f6fe0; }
</style>
</head>
<body>
<main>
  <svg viewBox="330 283 465 558" aria-hidden="true"><path fill="#ba66ef" d="M562.5 283 C564.37 283 566.234 283.022 568.093 283.066 C693.914 286.038 795 389.025 795 515.633 C795 642.242 693.914 745.229 568.093 748.199 L568.093 841 L330 841 L330 515.633 C330 387.154 434.094 283 562.5 283 Z"/></svg>
  <h1>Plot can't connect</h1>
  <p>Check your internet connection. Your files are safe in the cloud and will open as soon as you're back online.</p>
  <button onclick="window.plotDesktop.retry()">Try again</button>
</main>
<script>
  window.addEventListener('online', () => window.plotDesktop.retry());
</script>
</body>
</html>
